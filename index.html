<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PX Studio</title>
<style>
:root{--bg:#0e0f12;--panel:#15171c;--panel2:#1b1e25;--line:#2a2e38;--ink:#e7e5df;--dim:#a19e96;--faint:#666359;--acc:#8b5cf6;--acc2:#a78bfa;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--r:6px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--faint)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:#7c4dea}
button.sm{padding:3px 8px;font-size:12px}
button.danger{color:#fca5a5}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],select,textarea{background:#0b0c0f;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:60px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label.f{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.row>.nf{flex:0 0 auto}
.muted{color:var(--dim);font-size:12px}
.faint{color:var(--faint);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.free{border-color:#166534;color:#86efac}
.badge.paid{border-color:#92400e;color:#fcd34d}
header{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hd{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.04em}
.logo small{font-weight:400;color:var(--faint);margin-left:6px;font-size:11px}
nav{display:flex;gap:4px}
nav button{background:none;border:1px solid transparent}
nav button.on{border-color:var(--line);background:var(--panel2)}
.sp{flex:1}
main{max-width:1500px;margin:0 auto;padding:16px}
.cols{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.stack>*+*{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;background:#0b0c0f;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fav{position:absolute;top:4px;right:6px;color:#fbbf24;font-size:14px;text-shadow:0 0 3px #000}
.thumb .sel{position:absolute;top:4px;left:4px;width:18px;height:18px}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:10px 6px 3px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row{display:grid;grid-template-columns:22px 110px 1fr 28px;gap:6px;align-items:start;margin-bottom:6px}
.list-row textarea{min-height:34px}
.matrix{overflow:auto;max-height:78vh}
.matrix table{border-collapse:separate;border-spacing:6px}
.matrix th{font-size:12px;color:var(--dim);font-weight:600;text-align:left;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.matrix td.cell{width:170px;height:170px;padding:0;vertical-align:top}
.cellbox{position:relative;width:170px;height:170px;border:1px dashed var(--line);border-radius:var(--r);overflow:hidden;background:#0b0c0f}
.cellbox img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.cellbox .go{position:absolute;right:4px;bottom:4px;opacity:0;transition:opacity .15s}
.cellbox:hover .go,.cellbox .go.show{opacity:1}
.pack{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.pack .side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
@media(max-width:1000px){.pack{grid-template-columns:1fr}.pack .side{position:static;max-height:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel2);cursor:pointer;font-size:13px}
.chip.focus{border-color:var(--acc);background:#231b3a;color:#fff}
.chip.off{opacity:.55}
.chip .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.chip.inc .dot{background:var(--ok);border-color:var(--ok)}
.pv{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:none;border-radius:0;background:none;padding:4px 12px;font-size:12px}
.seg button.on{background:var(--panel2);color:var(--acc2)}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.scard.off{opacity:.5}
.scard .im{position:relative;aspect-ratio:1;background:#0b0c0f;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;cursor:pointer}
.scard .im img{width:100%;height:100%;object-fit:cover}
.scard .cnt{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:4px;color:#ddd}
.scard .inc{position:absolute;right:8px;top:8px;width:18px;height:18px;cursor:pointer}
.scard .ft{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.scard .nm{font-weight:600;font-size:13px}
.scard .bt{display:flex;gap:6px}
.scard .bt button{flex:1}
.scard.add{align-items:center;justify-content:center;border-style:dashed;min-height:220px;cursor:pointer;color:var(--dim);font-size:13px}
.scard.add:hover{border-color:var(--acc);color:var(--acc2)}
@keyframes pulse{50%{opacity:.35}}
.busy{animation:pulse 1.2s infinite;color:var(--acc2)!important}
.cellbox .cnt{position:absolute;left:4px;top:4px;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:4px}
.cellbox .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);text-align:center;padding:6px}
#queue{position:fixed;right:12px;bottom:12px;width:380px;max-width:calc(100vw - 24px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#queue .qh{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
#queue .qb{max-height:40vh;overflow:auto;border-top:1px solid var(--line);padding:6px 10px;display:none}
#queue.open .qb{display:block}
.job{font-size:12px;padding:4px 0;border-bottom:1px solid #20232b}
.job .jl{display:flex;gap:6px;align-items:center}
.job .jl span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .err{color:#fca5a5;word-break:break-all}
.s-queued{color:var(--faint)}.s-sending,.s-waiting{color:var(--warn)}.s-running{color:var(--acc2)}.s-done{color:var(--ok)}.s-failed{color:var(--err)}.s-canceled{color:var(--faint)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.93);display:none;align-items:center;justify-content:center;padding:20px}
#lb.open{display:flex}
#lb .lbin{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;max-width:1400px;width:100%;max-height:94vh}
@media(max-width:900px){#lb .lbin{grid-template-columns:1fr;overflow:auto}}
#lb img{max-width:100%;max-height:92vh;object-fit:contain;justify-self:center;border-radius:var(--r)}
#lb .meta{overflow:auto;font-size:12px}
#lb .meta pre{white-space:pre-wrap;word-break:break-word;background:#0b0c0f;border:1px solid var(--line);border-radius:var(--r);padding:8px;font-size:12px;margin:4px 0 10px}
#lb .hist{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
#lb .hist img{width:56px;height:56px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--line)}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.refs .r{position:relative;width:64px;height:64px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.refs .r img{width:100%;height:100%;object-fit:cover}
.refs .r button{position:absolute;top:1px;right:1px;padding:0 5px;font-size:11px}
.lora-row{display:grid;grid-template-columns:1fr 70px 26px;gap:6px;margin-bottom:4px}
table.lib{width:100%;border-collapse:collapse;font-size:12px}
table.lib td,table.lib th{border-bottom:1px solid var(--line);padding:4px;text-align:left}
table.lib input{padding:3px 6px}
.note{background:#12141a;border:1px solid var(--line);border-left:3px solid var(--acc);padding:8px 10px;border-radius:var(--r);font-size:12px;color:var(--dim)}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo">PX Studio<small>PixAI API 클라이언트 · 비공식</small></div>
  <nav id="tabs"></nav>
  <div class="sp"></div>
  <span class="muted" id="costBox"></span>
</div></header>
<main id="main"></main>
<div id="queue"><div class="qh" id="qh"><b>큐</b><span class="muted" id="qsum"></span><span class="sp"></span><button class="sm" id="qcancel">대기 취소</button><button class="sm" id="qclear">완료 지우기</button></div><div class="qb" id="qb"></div></div>
<div id="lb"></div>

<script>
'use strict';
/* ───────────── 상수 (PixAI 공개 문서·실측 2026-09 기준) ───────────── */
// 데스크톱(exe) 창 안에서 열리면 실행마다 새 토큰이 ?app= 으로 붙는다. 그때는 모든 호출을 exe 로컬 서버가 중계한다.
const DESK = new URLSearchParams(location.search).get('app') || '';
const API = DESK ? location.origin + '/api' : 'https://api.pixai.art';
const MOCK = new URLSearchParams(location.search).has('mock');
// 모델 종류(PixAI generationModel.type) → 앱 안 계열 이름. LoRA 계열(loraBaseModelTypes)은 모델 종류 값과 같다(2026-09-27 조회)
const TYPE_FAM = {MMDIT26B_MODEL:'tsubaki3', MMDIT26A_MODEL:'tsubaki2', SDXL_MODEL:'sdxl', SD_V1_MODEL:'sd1', DIT7_MODEL:'tsubaki1', DIT7B_MODEL:'tsubaki1',
  DIT9_MODEL:'dit9', USER_DIT26A_MODEL:'anima', USER_DIT26B_MODEL:'zimage', Z_IMAGE_V1_MODEL:'zimage', SD3_MEDIUM_MODEL:'sd3'};
const T3_ID = '2024383379556065549', T2_ID = '1983308862240288769';
const BUILTIN_MODELS = [
  {id:T3_ID, name:'Tsubaki.3', type:'MMDIT26B_MODEL', unit:4000},
  {id:'2050048243034896798', name:'Tsubaki.3 Flash', type:'MMDIT26B_MODEL', unit:null},
  {id:T2_ID, name:'Tsubaki.2', type:'MMDIT26A_MODEL', unit:2600},
  {id:'1861558740588989558', name:'Haruka v2 (SDXL)', type:'SDXL_MODEL', unit:null},
  {id:'1954632828118619567', name:'Hoshino v2 (SDXL)', type:'SDXL_MODEL', unit:null},
];
const CUSTOM_MODEL = {id:'custom', name:'직접 입력 (버전 ID)', type:null, unit:null};
let MYMODELS = (() => { try { const v = JSON.parse(localStorage.getItem('pxs.models') || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } })();   // 「모델 찾기」로 추가 [{id(버전), name, type}]
const MODELS = [];   // 같은 배열을 계속 쓴다(여러 곳이 참조) — 내용만 갈아 끼운다
function rebuildModels(){ MODELS.splice(0, MODELS.length, ...BUILTIN_MODELS, ...MYMODELS.filter(m => !BUILTIN_MODELS.some(b => b.id === m.id)), CUSTOM_MODEL); }
rebuildModels();
const RES = {'1:1':[[1024,1024],[1536,1536]],'2:3':[[848,1280],[1024,1536]],'3:2':[[1280,848],[1536,1024]],'3:4':[[864,1152],[1152,1536]],'4:3':[[1152,864],[1536,1152]],'3:5':[[768,1280],[912,1536]],'5:3':[[1280,768],[1536,912]],'9:16':[[720,1280],[864,1536]],'16:9':[[1280,720],[1536,864]],'1:3':[[512,1536],[512,1536]],'3:1':[[1536,512],[1536,512]]};
let PALETTES = [], STYLE_THUMBS = {}, PRICE_T = 0;   // 시작할 때 PixAI에서 읽는다(공식 팔레트 프리셋·스타일 키 썸네일)
let STYLES = ['anime-watercolor-impasto','art-crayon','bold-line-soft-color','chibi','classic-japanese','clean-flat-illustration','colored-pencil-grain','cool-warm-oil-contrast','desaturated-cool','flat-anime-pastel','glossy-glass-anime','grey-blocks-lineless','hard-line-monochrome-accent','high-contrast-retro-vivid','holographic','korean-style','lineart-watercolor-airy','low-saturation-expressive-eyes','lucid-dreamy','luminous-retro-impasto','minimal-flat-color','modern-oil-glamour','moe-pastel','oil-watercolor-blend','painterly-doodle','paper-watercolor','pencil-sketch','poster-graffiti','retro-comic-fusion','retro-oil-glamour','retro-tv-anime','semi-realistic','stable-vaporwave','tinted-sketch','vintage-collage'];
const SAMPLERS = ['Euler a','Euler','LMS','Heun','DPM2 Karras','DPM2 a Karras','DDIM','DPM++ 2M Karras','DPM++ 2S a Karras','DPM++ SDE Karras','DPM++ 2M SDE Karras','Restart'];
const DEFAULT_LORAS = [
  {alias:'haruka-style', id:'2051003597562149555', trigger:'harukav2 style', w:0.6, base:'MMDIT26B_MODEL', note:'PixAI 공식 · DiT.3'},
  {alias:'solrasido', id:'2057086305644541766', trigger:'sharp lines, reflective animation style, detailed eyes', w:0.5, base:'MMDIT26B_MODEL', note:'DiT.3'},
  {alias:'xipa', id:'2057321700192237743', trigger:'xipa style, detailed lineart, soft shading', w:0.5, base:'MMDIT26B_MODEL', note:'DiT.3'},
  {alias:'soft-lineart', id:'2057677077565784673', trigger:'delicate anime watercolor style, fine lineart, soft pastel shading', w:0.5, base:'MMDIT26B_MODEL', note:'DiT.3'},
];
const DEFAULT_SCENES = [
  ['기본','neutral expression, looking at viewer'],['미소','gentle smile, looking at viewer'],['웃음','laughing, open mouth, happy'],
  ['자신만만','smug smile, confident, hand on hip'],['분노','angry, furrowed brows, clenched teeth'],['슬픔','sad, teary eyes, looking down'],
  ['놀람','surprised, wide eyes, open mouth'],['부끄러움','embarrassed, heavy blush, looking away'],['짜증','annoyed, pout, frown'],
  ['진지','serious expression, calm'],['졸림','sleepy, half-closed eyes, yawning'],['도발','seductive smile, half-closed eyes, finger on lips'],
];
const TERMINAL = ['completed','failed','cancelled'];
const ACTIVE = ['sending', 'waiting', 'running', 'completed', 'saving'];   // 앱 쪽 진행 중(서버 완료 뒤 받는 중 포함)

/* ───────────── 유틸 ───────────── */
const $ = (s, r=document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const randSeed = () => Math.floor(Math.random() * 2147483647);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : String(c)); }
  return e;
}
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('저장 실패', e); } }
function joinParts(parts){
  let out = '';
  for (const p of parts.map(s => (s || '').trim()).filter(Boolean)) out = out ? out + (/[.!?]$/.test(out) ? ' ' : ', ') + p : p;
  return out;
}
function modelOf(p){ return MODELS.find(m => m.id === p.model) || {id:p.model, name:'모델 ' + p.model, type:null, unit:null}; }
function modelId(p){ return p.model === 'custom' ? String(p.custom || '').trim() : p.model; }
function modelType(p){ const m = modelOf(p); return m.type || (INFO[modelId(p)] && INFO[modelId(p)].type) || null; }
function fam(p){ const t = modelType(p); return t ? (TYPE_FAM[t] || 'other') : 'custom'; }
// 모델별 기능은 PixAI에서 읽는다(/v2/generation-model/{ver}/features·inference-profiles·size-config·style-keys). 못 읽었을 때만 계열 기본값
const INFO = (() => { try { return JSON.parse(localStorage.getItem('pxs.modelinfo') || '{}') || {}; } catch { return {}; } })();
const FALLBACK_FEATS = {
  tsubaki3:['lora', 'negativePrompt', 'styleKey', 'inferenceProfile', 'contextImages', 'colorPalette'],
  tsubaki2:['lora', 'negativePrompt', 'styleKey', 'inferenceProfile'],
  sdxl:['lora', 'controlnet', 'upscale', 'enableADetailer', 'clipSkip', 'negativePrompt', 'cfgScale'],
  other:['lora', 'negativePrompt', 'cfgScale']};
// SDXL·SD1은 기능 목록에 없어도 샘플러·스텝을 받는다(2026-09-27 Haruka v2 실측: 파라미터 유지·완료)
const EXTRA_FEATS = {sdxl:['samplingMethod', 'samplingSteps'], sd1:['samplingMethod', 'samplingSteps']};
// 품질 프로필. 옛 판의 Tsubaki.2 「모드」(p.mode)가 남아 있으면 그것이 T2 값이다(새 판은 프로필을 고르면 mode를 비운다).
// 모델이 알려 준 프로필 목록에 없는 값(다른 모델에서 고른 것)은 보내지 않는다
function profOf(p){
  const v = (fam(p) === 'tsubaki2' && p.mode) ? p.mode : (p.profile || '');
  const i = INFO[modelId(p)];
  return v && i && i.profiles && i.profiles.length && !i.profiles.some(x => x.name === v) ? '' : v;
}
function feat(p, name){
  if ((EXTRA_FEATS[fam(p)] || []).includes(name)) return true;
  const i = INFO[modelId(p)]; if (i && Array.isArray(i.features)) return i.features.includes(name);
  return (FALLBACK_FEATS[fam(p)] || FALLBACK_FEATS.other).includes(name);
}
function maxSide(p){ const i = INFO[modelId(p)]; const r = i && i.sizes && i.sizes.length ? Math.max(...i.sizes.map(x => Math.max(x.maxWidth || 0, x.maxHeight || 0))) : 0; return r || (fam(p) === 'tsubaki3' ? 2496 : 0); }
const INFO_LOADING = new Map();   // 버전 → 진행 중인 조회(보내기 직전에 기다릴 수 있게)
function loadModelInfo(ver, known){
  if (!ver || MOCK || !S.key) return Promise.resolve();
  const cur = INFO[ver]; if (cur && Date.now() - (cur.at || 0) < 86400000) return Promise.resolve();
  if (!INFO_LOADING.has(ver)) INFO_LOADING.set(ver, fetchModelInfo(ver, known).finally(() => INFO_LOADING.delete(ver)));
  return INFO_LOADING.get(ver);
}
async function fetchModelInfo(ver, known){
  try {
    const get = path => http(API + '/v2/generation-model/' + encodeURIComponent(ver) + path, {headers:auth()}).catch(e => (e.status === 404 ? null : Promise.reject(e)));
    const [f, pr, sz, sk] = await Promise.all([get('/features'), get('/inference-profiles'), get('/size-config'), get('/style-keys')]);
    let type = known || (f && f.modelType) || null;

function dims(p, v1){

  const mx = maxSide(p);
  if (p.size === 'custom' && mx && !v1) return [snap16(p.sizeW, 512, mx), snap16(p.sizeH, 512, mx)];
  let [w, hh] = RES[p.aspect][p.size === '1.5k' ? 1 : 0];
  if (v1){ // v1 한 변 512~1280
    [w, hh] = RES[p.aspect][0];
    const k = Math.min(1, 1280 / Math.max(w, hh));
    w = Math.max(512, Math.round(w * k / 16) * 16); hh = Math.max(512, Math.round(hh * k / 16) * 16);
  } else if (mx && Math.max(w, hh) > mx){ // 1.5k 프리셋이 모델 최대 변(SDXL 1400 등)을 넘으면 비율을 지켜 줄인다

  }

}

async function http(url, opt, retryPost){

  for (let a = 0; ; a++){

    }
    // 429도 POST는 재전송하지 않는다 — 과금 뒤에 제한이 걸렸을 가능성을 배제할 수 없다.
    if (isGet && r.status === 429 && a < 3){ await sleep(3000 * (a + 1)); continue; }

    const txt = await r.text(); let js = null; try { js = JSON.parse(txt); } catch {}

const TABS = [['gen', '단일 생성'], ['pack', '씬 팩'], ['gallery', '갤러리'], ...(DESK ? [['train', 'LoRA 학습']] : []), ['settings', '설정']];
function go(t){ TAB = t; saveSoon(); render(); }
function renderTabs(){ $('#tabs').replaceChildren(...TABS.map(([k, t]) => h('button', {class:TAB === k ? 'on' : '', onclick:() => go(k)}, t))); }
function renderCost(){
  if (DESK){
    $('#costBox').replaceChildren(h('span', {title:'눌러서 크레딧 기록 보기 · 생성이 끝날 때마다 다시 읽음', style:'cursor:pointer;text-decoration:underline dotted', onclick:creditLog}, BAL == null ? '잔액 —' : `잔액 ${BAL.toLocaleString()} 크레딧 `),
      h('button', {class:'sm', title:'잔액 새로고침', onclick:refreshBal}, '↻'));
    return;
  }
  $('#costBox').replaceChildren(h('span', {}, `응답 기준 유료 차감 누계 ${COST.toLocaleString()} `), h('button', {class:'sm', onclick:() => { if (confirm('누계를 0으로 돌릴까요?')){ COST = 0; saveAll(); renderCost(); } }}, '초기화')); }
function render(){
  renderTabs(); renderCost();
  const m = $('#main');

/* LoRA 학습 (창 앱 전용 · GraphQL createTrainingTask · 2026-09 실측: 최소 10장 · Tsubaki.3 버전 ID · 약 50분 · 프리미엄 월 10회 무료) */
const T3_VERSION = '2024383379556065549';
const TRAIN_CATS = [['style', '스타일']];

const saveTrain = () => lsSet('pxs.train', TRAIN);
let MYLORAS = null, trainMsg = '', TRAIN_BUSY = false;
const TASK_Q = 'query($id: ID!){ trainingTask(id: $id){ id status refId extra { progress estimatedTotalTime } outputs { message } parameters { title triggerWords category } } }';
async function loadMyLoras(){
  if (!ME) await refreshBal();
  if (!ME) throw new Error('계정 정보를 못 읽었습니다(키 확인)');
  const d = await gql('query($a: ID){ generationModels(first: 50, authorId: $a, orderBy: "created_at"){ edges { node { id title type category latestAvailableVersion { id status loraBaseModelType } trainingTask { id status parameters { triggerWords } } } } } }', {a:ME});
  MYLORAS = d.generationModels.edges.map(e => e.node).filter(n => /LORA/.test(n.type));
}
async function pollTrainTasks(){
  const open = TRAIN.tasks.filter(t => !['completed', 'failed', 'cancelled'].includes(t.status));
  for (const t of open){
    try { const d = await gql(TASK_Q, {id:t.id}); const x = d.trainingTask; t.status = x.status; t.progress = x.extra && x.extra.progress; t.refId = x.refId; t.message = x.outputs && x.outputs.message; }
    catch (e){ t.message = e.message; }
  }
  saveTrain();
  if (open.some(t => t.status === 'completed')) try { await loadMyLoras(); } catch {}
  return open.length;
}
setInterval(async () => { if (DESK && S.key && TRAIN.tasks.some(t => !['completed', 'failed', 'cancelled'].includes(t.status))){ await pollTrainTasks(); const a = document.activeElement; if (TAB === 'train' && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render(); } }, 60000);
function addToLibrary(title, versionId, trigger){
  if (LORAS.some(l => l.id === versionId)) return;

}

      h('div', {class:'row'},
        h('div', {}, h('label', {class:'f'}, '제목'), h('input', {type:'text', value:TRAIN.title, placeholder:'예: my style v1', oninput:e => { TRAIN.title = e.target.value; saveTrain(); }})),
        h('div', {style:'flex:0 0 160px'}, h('label', {class:'f'}, '분류'), h('select', {onchange:e => { TRAIN.category = e.target.value; saveTrain(); }}, TRAIN_CATS.map(([v, t]) => h('option', {value:v, selected:v === TRAIN.category}, t))))),

  const loadMore = async () => {
    const batch = ids.slice(shown, shown + 24); shown += batch.length; info.textContent = '작업 정보를 읽는 중…';
    for (let i = 0; i < batch.length; i += 4){
      const got = await Promise.all(batch.slice(i, i + 4).map(id => gql(TQ, {id}).then(d => d.task).catch(() => null)));
      got.forEach(t => { if (t && t.status === 'completed' && outIds(t).length) tasks.push(t); });
      drawGrid();
    }
    info.textContent = '웹에서 만든 작업과, 크레딧이 빠진 API 작업이 보입니다. 무제한 레인(무료) 작업은 기록이 없어 여기 안 나옵니다.' + (info.dataset.warn ? ' · ' + info.dataset.warn : '');
  };
  const doImport = async e => {
    if (IMPORT_BUSY) return;
    IMPORT_BUSY = true; const btn = e.currentTarget; btn.disabled = true; let n = 0, fail = 0;
    try {
    for (const t of tasks.filter(x => sel.has(x.id))){
      const par = t.parameters || {}, vid = isVidTask(t);
      for (const mid of outIds(t)){
        if (have.has(mid) || !(await claimMid(mid))){ have.add(mid); continue; }
        btn.textContent = `가져오는 중 ${n + 1}…`;
        try {
          const m = (await gql('query($id: String!){ media(id: $id){ type width height fileUrl urls { variant url } } }', {id:mid})).media;
          const url = vid ? m.fileUrl : ((m.urls || []).find(u => u.variant === 'PUBLIC') || {}).url;
          if (!url) throw new Error('주소 없음');
          const blob = await api.image(url);
          const p = paramsFromTask(par), [kind, tool] = kindFromTask(par);
          const rec = {id:uid(), createdAt:Date.parse(t.createdAt) || Date.now(), blob, mediaId:mid, taskId:t.id, prompt:par.prompts || (par.i2vPro && par.i2vPro.prompts) || (par.chat && par.chat.prompts) || '', negative:par.negativePrompts || '',
            seed:+par.seed || (t.outputs && t.outputs.seed) || 0, model:par.modelId || '', modelName:(MODELS.find(x => x.id === par.modelId) || {}).name || 'PixAI', w:m.width || par.width, h:m.height || par.height,
            aspect:p.aspect, size:p.size, loras:p.loras, params:p, via:'import', paid:t.paidCredit || null, source:'import', projectId:null, cellKey:null, label:'PixAI 기록', fav:false, kind, tool};
          await DB.put('images', rec); IMAGES.push(rec); have.add(mid); n++;
        } catch (err){ fail++; console.warn('가져오기 실패', mid, err); }
        finally { releaseMid(mid); }
      }
      sel.delete(t.id);
    }
    } finally { IMPORT_BUSY = false; }
    IMAGES.sort((a, b) => b.createdAt - a.createdAt);
    info.textContent = `${n}장 가져옴` + (fail ? ` · 실패 ${fail}` : '') + ' · 갤러리의 「PixAI 기록」에서 볼 수 있습니다.';
    drawGrid(); if (TAB === 'gallery') render();
  };
  info.textContent = '작업 정보를 읽는 중…';
  await loadMore();
}

/* 큐 패널 */
const LABEL = {queued:'대기', sending:'전송', waiting:'서버 대기', running:'생성 중', done:'완료', failed:'실패', canceled:'취소', completed:'받는 중', saving:'받는 중', cancelled:'취소'};
let qFoldT = 0;
function renderQueue(){
  const c = s => Q.jobs.filter(j => j.status === s).length;
  const act = Q.jobs.filter(j => ACTIVE.includes(j.status)).length;
  $('#qsum').textContent = `진행 ${act} · 대기 ${c('queued')} · 완료 ${c('done')} · 실패 ${c('failed')}`;
  // 전부 성공으로 끝나면 결과를 가리지 않게 접는다(실패가 있으면 오류를 보라고 열어 둔다)
  clearTimeout(qFoldT);
  if (Q.jobs.length && !act && !c('queued') && !c('failed')) qFoldT = setTimeout(() => $('#queue').classList.remove('open'), 2500);
  $('#qb').replaceChildren(...(Q.jobs.length ? Q.jobs.slice(0, 200).map(j => h('div', {class:'job'},
    h('div', {class:'jl'}, h('span', {title:j.prompt}, j.label || j.prompt.slice(0, 50)), h('span', {class:'badge ' + (j.via === 'relay' ? 'free' : 'paid')}, j.via === 'relay' ? '무제한' : '유료'), h('b', {class:'s-' + j.status}, LABEL[j.status] || j.status)),
    j.error ? h('div', {class:'err'}, j.error) : null,
    // 실패했지만 서버 작업 ID가 있으면: 같은 작업을 다시 따라가 결과만 받는다(새 과금 없음)
    j.status === 'failed' && j.taskId ? h('button', {class:'sm', style:'margin-top:3px;margin-right:4px', title:'새로 만들지 않고 같은 작업의 결과를 다시 받습니다', onclick:() => { j.status = 'queued'; j.error = null; renderQueue(); Q.pump(); }}, '결과 다시 받기') : null,
    // 서버에 들어간 작업 취소(창 앱 · GraphQL cancelGenerationTask). PixAI는 이미 시작한 작업의 과금을 되돌려 주지 않을 수 있다.
    DESK && j.taskId && ['waiting', 'running'].includes(j.status) && !j.cancelReq ? h('button', {class:'sm', style:'margin-top:3px', onclick:async () => {
      if (!confirm('이 작업을 PixAI에서 취소할까요?\n취소해도 이미 받은 크레딧은 돌아오지 않았습니다 (2026-09-27 실측: 영상 대기 중 취소, 7,700 차감 유지).')) return;
      try { await api.cancel(j.taskId); j.cancelReq = true; j.error = '취소 요청함 · 서버가 끝낼 때까지 따라감'; renderQueue(); refreshBalSoon(); } catch (e){ alert('취소 실패: ' + e.message); }
    }}, '작업 취소') : null)) : [h('div', {class:'faint'}, '작업이 없습니다.')]));
  if (TAB === 'pack' && packRedraw) packRedraw();
}
$('#qh').onclick = e => { if (e.target.tagName !== 'BUTTON') $('#queue').classList.toggle('open'); };
$('#qcancel').onclick = () => { Q.jobs.forEach(j => { if (j.status === 'queued') j.status = 'canceled'; }); renderQueue(); };
$('#qclear').onclick = () => { Q.jobs = Q.jobs.filter(j => !['done', 'failed', 'canceled'].includes(j.status)); renderQueue(); };
// 닫을 때: 400ms 지연 저장(saveSoon)이 남아 있으면 바로 저장 · 진행·받는 중 작업이 있으면 경고
window.addEventListener('beforeunload', e => { clearTimeout(saveT); saveAll(); if (Q.jobs.some(j => j.status === 'queued' || ACTIVE.includes(j.status))){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('pagehide', () => { clearTimeout(saveT); saveAll(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ clearTimeout(saveT); saveAll(); } });

/* 시작 */
(async () => {
  try { IMAGES = (await DB.all('images')).sort((a, b) => b.createdAt - a.createdAt); DIR = await DB.get('kv', 'dir') || null; }
  catch (e){ console.warn('IndexedDB 사용 불가', e); }
  if (DESK){   // 저장된 키 불러오기. 이전 판이 localStorage에 남긴 평문 키는 버린다
    S.key = '';
    await new Promise(r => { const t0 = Date.now(); const tick = () => papi() || Date.now() - t0 > 15000 ? r() : setTimeout(tick, 100); tick(); });
    // get_key: "" = 저장된 키 없음(정상) · null = 파일은 있는데 못 읽음(KEY_LOADED를 세우지 않아 빈칸 저장이 파일을 못 지운다)
    try { if (papi()){ const k = await papi().get_key(); if (typeof k === 'string'){ S.key = k; KEY_LOADED = true; } } } catch (e){ console.warn('키 불러오기 실패', e); }
    saveAll();
  }
  if (DESK && new URLSearchParams(location.search).has('alt')) $('main').before(h('div', {class:'note', style:'max-width:1500px;margin:10px auto 0;border-left-color:var(--warn)'}, 'PX Studio 창이 이미 하나 열려 있어서 이 창은 갤러리·프로젝트·설정을 따로 씁니다. 먼저 연 창을 쓰세요.'));
  render(); renderQueue(); refreshBal(); loadLists();
})();
</script>
